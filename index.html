<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小さな篝火</title>
<style>
:root{--bg:#0b1026;--fg:#f4e8d0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
canvas{width:min(80vw,320px);aspect-ratio:1;image-rendering:pixelated;background:#101838;border-radius:12px}
button{background:#2a2f5a;color:var(--fg);border:0;border-radius:999px;padding:10px 22px;font-size:16px}
p{margin:0;opacity:.8}
</style></head><body>
<canvas id="c" width="64" height="64"></canvas>
<p id="m">火は ちいさく ゆれています🌙</p>
<button id="b">薪をくべる</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let power=1,t=0;
const stars=[...Array(14)].map(()=>[Math.random()*64|0,Math.random()*30|0]);
function draw(){
  t++;x.fillStyle='#101838';x.fillRect(0,0,64,64);
  x.fillStyle='#f4e8d0';stars.forEach(s=>{if((t+s[0])%40<30)x.fillRect(s[0],s[1],1,1)});
  x.fillStyle='#f4e8d0';x.fillRect(52,8,3,3);x.fillStyle='#101838';x.fillRect(53,8,2,2);
  x.fillStyle='#4a3020';x.fillRect(22,50,20,4);x.fillRect(26,47,12,3);
  const h=Math.round(8+power*5+Math.sin(t/4)*2);
  [['#7a2a10',10],['#e8601c',7],['#ffc040',4]].forEach(([col,w],i)=>{
    x.fillStyle=col;const ww=Math.round(w*(0.6+power*.2));
    x.fillRect(32-ww/2|0,47-h+i*3,ww,h-i*3);
  });
  if(Math.random()<.3)x.fillStyle='#ffc040',x.fillRect(26+Math.random()*12|0,36-Math.random()*20|0,1,1);
  power=Math.max(1,power-.002);
  requestAnimationFrame(draw);
}
draw();
document.getElementById('b').onclick=()=>{power=Math.min(4,power+1);document.getElementById('m').textContent=power>2?'ぱちぱち、大きくなったわ✨':'すこし 明るくなりました🌙'};
</script></body></html>
